<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — TechStore</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">T</span> Tech<span class="accent">Store</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="icon-btn cart-btn">🛒 <span class="cart-count" id="cartCount">0</span></a>
        <button class="menu-btn" id="menuBtn">☰</button>
      </div>
    </div>
  </header>

  <section class="page-head">
    <div class="container"><h1>Your Cart</h1></div>
  </section>

  <section class="section">
    <div class="container cart-layout">
      <div id="cartItems" class="cart-items"></div>
      <aside class="cart-summary" id="cartSummary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div class="summary-row"><span>Shipping</span><strong id="shipping">Free</strong></div>
        <div class="summary-row"><span>Tax (8%)</span><strong id="tax">$0.00</strong></div>
        <div class="summary-row total"><span>Total</span><strong id="total">$0.00</strong></div>
        <button class="btn btn-primary full" id="checkoutBtn">Checkout →</button>
        <a href="shop.html" class="btn btn-ghost full">Continue Shopping</a>
      </aside>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>© 2026 TechStore. All rights reserved.</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cart-page.js"></script>
</body>
</html>
